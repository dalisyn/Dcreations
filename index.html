    <script>
      // Make window.fetch writable so third-party browser extensions can set interceptors without TypeError
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            }
          });
        } catch (e) {}

        // Suppress external browser extension script errors from bubbling to app crashes
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
